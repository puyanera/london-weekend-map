<style>
/* Layout: a live Leaflet map fills the screen. A title card floats top-left, the venue list floats right (bottom sheet on phones). Weekend pins are cobalt and solid, ongoing pins are grey rings. */
:root {
  --bg: #F2F4F3;
  --surface: #FFFFFF;
  --glass: rgba(255, 255, 255, .95);
  --ink: #17201D;
  --ink-soft: #56635E;
  --line: #DCE1DE;
  --accent: #2747D6;
  --accent-ink: #FFFFFF;
  --ongoing: #6E7B76;
  --font-body: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1513; --surface: #171F1C; --glass: rgba(23, 31, 28, .95); --ink: #E8EEEB; --ink-soft: #9AA8A2; --line: #2A3531;
    --accent: #8EA6FF; --accent-ink: #0B1020; --ongoing: #8A9892;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1513; --surface: #171F1C; --glass: rgba(23, 31, 28, .95); --ink: #E8EEEB; --ink-soft: #9AA8A2; --line: #2A3531;
  --accent: #8EA6FF; --accent-ink: #0B1020; --ongoing: #8A9892;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); margin: 0; overflow: hidden; }
.app { position: relative; height: 100%; overflow: hidden; background: var(--bg); }
button { font-family: inherit; }
button:focus-visible, .mk:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#map { position: absolute; inset: 0; z-index: 0; background: #e8ecef; font-family: var(--font-body); }
.leaflet-control-attribution { font-size: 11px; }
.mkicon { background: none; border: 0; }
.mk { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); padding: 0; margin: 0; border: 0; background: none; cursor: pointer; }
.mk .dot { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); border: 2px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.45); font: 500 12px/1 var(--font-mono); }
.mk.ongoing .dot { width: 18px; height: 18px; background: #fff; color: #5b6761; border: 2px solid #5b6761; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.mk.later .dot { width: 18px; height: 18px; background: #fff; color: #5b6761; border: 2px dashed #5b6761; box-shadow: none; }
.mk.approx .dot { outline: 2px dotted #4a5550; outline-offset: 2px; }
.mk .tag { position: absolute; left: 50%; bottom: calc(100% + 7px); transform: translateX(-50%); white-space: nowrap; padding: 3px 8px; border-radius: 4px; background: #17201D; color: #fff; font: 500 12px var(--font-body); pointer-events: none; opacity: 0; }
.mk:hover .tag, .mk:focus-visible .tag, .mk.sel .tag { opacity: 1; }
.mk.sel .dot { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 35%, transparent), 0 1px 5px rgba(0,0,0,.4); }

.hud { position: absolute; z-index: 10; left: 12px; top: 12px; max-width: min(460px, calc(100% - 24px)); padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--glass); }
.kicker { margin: 0 0 2px; font: 500 11px/1.3 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
h1 { margin: 0 0 10px; font-size: clamp(20px, 3vw, 28px); line-height: 1.1; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; font: 500 13px var(--font-body); cursor: pointer; }
.chip[aria-pressed="false"] { color: var(--ink-soft); background: transparent; }
.chip[aria-pressed="false"] .key { opacity: .35; }
.key { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); }
.key.ongoing { background: transparent; border: 2px solid var(--ongoing); }
.key.later { background: transparent; border: 2px dashed var(--ongoing); }
.chip b { font: 500 12px var(--font-mono); color: var(--ink-soft); }

.ctl { position: absolute; z-index: 10; left: 12px; bottom: 34px; display: flex; flex-direction: column; gap: 4px; }
.ctl button { min-width: 38px; height: 38px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--glass); color: var(--ink); font: 500 17px var(--font-body); cursor: pointer; }
.ctl button.sm { font-size: 12px; }
.empty { position: absolute; inset: 0; z-index: 5; display: none; place-items: center; color: var(--ink-soft); pointer-events: none; }

.panel { position: absolute; z-index: 10; right: 12px; top: 12px; bottom: 12px; width: 380px; display: flex; flex-direction: column; gap: 8px; min-height: 0; pointer-events: none; }
.panel > * { pointer-events: auto; }
.ptoggle { align-self: flex-end; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--glass); color: var(--ink); font: 500 13px var(--font-body); cursor: pointer; }
.ptoggle .chev { width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .2s; }
.panel[data-open="true"] .ptoggle .chev { transform: rotate(135deg); }
.panel[data-open="false"] { bottom: auto; width: auto; }
.panel[data-open="false"] .list, .panel[data-open="false"] .note { display: none; }
.list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 2px; }
.card { flex: none; border: 1px solid var(--line); border-radius: 8px; background: var(--glass); padding: 12px 14px; cursor: pointer; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card h2 { margin: 0; font-size: 16px; line-height: 1.25; font-weight: 700; }
.addr { margin: 2px 0 0; font: 400 12px/1.4 var(--font-mono); color: var(--ink-soft); }
.ev { margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--line); }
.ev .t { margin: 0; font-weight: 500; }
.ev .t a { color: var(--ink); text-decoration-color: var(--accent); text-underline-offset: 3px; }
.ev .cat { font: 500 11px var(--font-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.ev .cat.ongoing, .ev .cat.later { color: var(--ink-soft); }
.ev p { margin: 2px 0 0; color: var(--ink-soft); font-size: 13.5px; }
.ev .when { font: 400 12.5px/1.4 var(--font-mono); color: var(--ink); }
.note { margin: 0; padding: 6px 12px; border-radius: 6px; background: var(--glass); color: var(--ink-soft); font-size: 12px; }
.note a { color: inherit; }

@media (max-width: 820px) {
  .hud { right: 12px; max-width: none; }
  .panel { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 46%; }
  .panel[data-open="false"] { left: auto; }
  .ctl { left: auto; right: 12px; bottom: 80px; }
  .app[data-open="true"] .ctl { bottom: calc(46% + 20px); }
}
@media (prefers-reduced-motion: reduce) { .ptoggle .chev { transition: none; } }
</style>

  var $ = function (id) { return document.getElementById(id); };
  var app = $('app'), panel = $('panel');
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function safeUrl(u) { return typeof u === 'string' && u.indexOf('https://') === 0 ? u : null; }
  function isMobile() { return matchMedia('(max-width: 820px)').matches; }
  function isOpen() { return panel.dataset.open === 'true'; }

  var src = $('src'); var su = safeUrl(D.source.url); if (su) { src.href = su; src.target = '_blank'; } else { src.removeAttribute('href'); }
  try { $('issued').textContent = 'issue of ' + new Date(D.source.issued + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); } catch (e) {}

  var map = L.map('map', { zoomControl: false, attributionControl: false, zoomSnap: 0.25, zoomDelta: 1, wheelPxPerZoomLevel: 90 });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
  L.control.attribution({ position: 'bottomleft', prefix: false }).addTo(map);
  map.setView([51.515, -0.12], 12);

  function insets() {
    var h = $('map').clientHeight, hudBottom = $('hud').getBoundingClientRect().bottom;
    if (isMobile()) return { tl: [24, hudBottom + 16], br: [24, (isOpen() ? h * 0.46 + 16 : 70) + 8] };
    return { tl: [24, 24], br: [(isOpen() ? 404 : 24) + 24, 24] };
  }
  function visibleVenues() { return D.venues.filter(function (v) { return visibleEvents(v).length; }); }
  function fit() {
    var vs = visibleVenues(); if (!vs.length) return;
    var i = insets();
    map.fitBounds(L.latLngBounds(vs.map(function (v) { return [v.lat, v.lng]; })), { paddingTopLeft: i.tl, paddingBottomRight: i.br, maxZoom: 15, animate: false });
  }

  /* filters */
  ORDER.forEach(function (c) {
    if (!D.counts[c]) return;
    var b = el('button', 'chip'); b.type = 'button'; b.setAttribute('aria-pressed', 'true');
    b.appendChild(el('span', 'key ' + c)); b.appendChild(document.createTextNode(LABEL[c])); b.appendChild(el('b', '', String(D.counts[c])));
    b.addEventListener('click', function () { active[c] = !active[c]; b.setAttribute('aria-pressed', String(active[c])); render(); });
    $('filters').appendChild(b);
  });

  /* panel toggle */
  function setOpen(open) {
    panel.dataset.open = String(open); app.dataset.open = String(open);
    $('ptoggle').setAttribute('aria-expanded', String(open));
  }
  $('ptoggle').addEventListener('click', function () { setOpen(!isOpen()); });
  if (isMobile()) setOpen(false);

  /* venues */
  function visibleEvents(v) { return v.events.filter(function (e) { return active[e.category]; }); }
  function topCat(evs) { for (var i = 0; i < ORDER.length; i++) { if (evs.some(function (e) { return e.category === ORDER[i]; })) return ORDER[i]; } return 'ongoing'; }
  var markers = [], cards = [];
  D.venues.forEach(function (v, i) {
    var b = el('button', 'mk'); b.type = 'button';
    var dot = el('span', 'dot'); b.appendChild(dot); b.appendChild(el('span', 'tag', v.name));
    L.DomEvent.disableClickPropagation(b);
    b.addEventListener('click', function () { select(i, false); });
    var mk = L.marker([v.lat, v.lng], { icon: L.divIcon({ className: 'mkicon', html: b, iconSize: [0, 0] }), keyboard: false }).addTo(map);
    markers.push({ el: b, dot: dot, mk: mk });
    var c = el('article', 'card'); c.tabIndex = 0;
    c.addEventListener('click', function (ev) { if (ev.target.closest('a')) return; select(i, true); });
    c.addEventListener('keydown', function (ev) { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target === c) { ev.preventDefault(); select(i, true); } });
    cards.push(c);
  });

  function renderCard(i) {
    var v = D.venues[i], c = cards[i], evs = visibleEvents(v);
    c.textContent = '';
    c.appendChild(el('h2', '', v.name));
    c.appendChild(el('p', 'addr', v.address + ', ' + v.postcode));
    evs.forEach(function (e) {
      var d = el('div', 'ev');
      d.appendChild(el('span', 'cat ' + e.category, LABEL[e.category]));
      var t = el('p', 't'); var u = safeUrl(e.url);
      if (u) { var a = el('a', '', e.title); a.href = u; a.target = '_blank'; a.rel = 'noopener'; t.appendChild(a); } else { t.textContent = e.title; }
      d.appendChild(t);
      if (e.when) d.appendChild(el('p', 'when', e.when));
      var meta = [e.price, e.age && ('Ages: ' + e.age)].filter(Boolean).join(' · ');
      if (meta) d.appendChild(el('p', '', meta));
      if (e.blurb) d.appendChild(el('p', '', e.blurb));
      c.appendChild(d);
    });
  }

  function render() {
    var list = $('list'); list.textContent = '';
    var shown = [];
    D.venues.forEach(function (v, i) {
      var evs = visibleEvents(v), m = markers[i];
      if (!evs.length) { m.el.hidden = true; return; }
      m.el.hidden = false;
      var cat = topCat(evs);
      m.el.className = 'mk ' + cat + (v.approx ? ' approx' : '') + (selected === i ? ' sel' : '');
      m.mk.setZIndexOffset(selected === i ? 1000 : cat === 'weekend' ? 200 : 0);
      m.dot.textContent = evs.length > 1 ? String(evs.length) : '';
      m.el.setAttribute('aria-label', v.name + ', ' + evs.length + (evs.length > 1 ? ' events' : ' event'));
      renderCard(i); shown.push({ i: i, cat: cat, name: v.name });
    });
    shown.sort(function (a, b) { return ORDER.indexOf(a.cat) - ORDER.indexOf(b.cat) || a.name.localeCompare(b.name); });
    shown.forEach(function (s) { cards[s.i].className = 'card' + (selected === s.i ? ' sel' : ''); list.appendChild(cards[s.i]); });
    shownCount = shown.length;
    $('plabel').textContent = shownCount + (shownCount === 1 ? ' venue' : ' venues');
    $('empty').style.display = shownCount ? 'none' : 'grid';
  }

  function select(i, recenter) {
    selected = i;
    if (!isOpen()) setOpen(true);
    render();
    if (recenter) {
      var v = D.venues[i], p = insets();
      map.fitBounds(L.latLngBounds([[v.lat, v.lng]]), { paddingTopLeft: p.tl, paddingBottomRight: p.br, maxZoom: Math.max(map.getZoom(), 15), animate: true });
    } else { cards[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }

  $('zin').addEventListener('click', function () { map.zoomIn(); });
  $('zout').addEventListener('click', function () { map.zoomOut(); });
  $('reset').addEventListener('click', function () { selected = null; render(); fit(); });
  var fullBtn = $('full');
  if (!document.fullscreenEnabled) { fullBtn.hidden = true; }
  fullBtn.addEventListener('click', function () {
    try {
      var p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      if (p && p.catch) p.catch(function () { fullBtn.hidden = true; });
    } catch (e) { fullBtn.hidden = true; }
  });
  window.addEventListener('resize', function () { map.invalidateSize(); });

  render(); fit();
})();
</script>
</body>
</html>
