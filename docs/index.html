<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>London Weekend Map</title>
<meta name="description" content="Kid-friendly London events for the weekend, mapped from the Dads in London newsletter.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;700&display=swap">
<style>
/* Layout: a live Leaflet map fills the screen. A title card floats top-left. Clicking a dot opens a pop-up bubble anchored to that dot. Weekend pins are cobalt and solid, ongoing pins are grey rings. */
:root {
  --bg: #F2F4F3;
  --surface: #FFFFFF;
  --glass: rgba(255, 255, 255, .96);
  --ink: #17201D;
  --ink-soft: #56635E;
  --line: #DCE1DE;
  --accent: #2747D6;
  --accent-ink: #FFFFFF;
  --ongoing: #6E7B76;
  --font-body: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1513; --surface: #171F1C; --glass: rgba(23, 31, 28, .96); --ink: #E8EEEB; --ink-soft: #9AA8A2; --line: #2A3531;
    --accent: #8EA6FF; --accent-ink: #0B1020; --ongoing: #8A9892;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1513; --surface: #171F1C; --glass: rgba(23, 31, 28, .96); --ink: #E8EEEB; --ink-soft: #9AA8A2; --line: #2A3531;
  --accent: #8EA6FF; --accent-ink: #0B1020; --ongoing: #8A9892;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); margin: 0; overflow: hidden; }
.app { position: relative; height: 100%; overflow: hidden; background: var(--bg); }
button { font-family: inherit; }
button:focus-visible, .mk:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#map { position: absolute; inset: 0; z-index: 0; background: #e8ecef; font-family: var(--font-body); }
.leaflet-control-attribution { font-size: 11px; }
.mkicon { background: none; border: 0; }
.mk { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); padding: 0; margin: 0; border: 0; background: none; cursor: pointer; }
.mk .dot { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); border: 2px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.45); font: 500 12px/1 var(--font-mono); }
.mk.ongoing .dot { width: 18px; height: 18px; background: #fff; color: #5b6761; border: 2px solid #5b6761; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.mk.later .dot { width: 18px; height: 18px; background: #fff; color: #5b6761; border: 2px dashed #5b6761; box-shadow: none; }
.mk.approx .dot { outline: 2px dotted #4a5550; outline-offset: 2px; }
.mk .tag { position: absolute; left: 50%; bottom: calc(100% + 7px); transform: translateX(-50%); white-space: nowrap; padding: 3px 8px; border-radius: 4px; background: #17201D; color: #fff; font: 500 12px var(--font-body); pointer-events: none; opacity: 0; }
.mk:hover .tag, .mk:focus-visible .tag { opacity: 1; }
.mk.sel .tag { display: none; }
.mk.sel .dot { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 40%, transparent), 0 1px 5px rgba(0,0,0,.4); }
.mk.sel.ongoing .dot, .mk.sel.later .dot { box-shadow: 0 0 0 6px rgba(91, 103, 97, .35), 0 1px 3px rgba(0,0,0,.3); }

.hud { position: absolute; z-index: 10; left: 12px; top: 12px; max-width: min(460px, calc(100% - 24px)); padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--glass); }
.kicker { margin: 0 0 2px; font: 500 11px/1.3 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
h1 { margin: 0 0 10px; font-size: clamp(20px, 3vw, 28px); line-height: 1.1; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; font: 500 13px var(--font-body); cursor: pointer; }
.chip[aria-pressed="false"] { color: var(--ink-soft); background: transparent; }
.chip[aria-pressed="false"] .key { opacity: .35; }
.key { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); }
.key.ongoing { background: transparent; border: 2px solid var(--ongoing); }
.key.later { background: transparent; border: 2px dashed var(--ongoing); }
.chip b { font: 500 12px var(--font-mono); color: var(--ink-soft); }
.hint { margin: 8px 0 0; font-size: 12px; color: var(--ink-soft); }
.hint a { color: inherit; }

.ctl { position: absolute; z-index: 10; left: 12px; bottom: 34px; display: flex; flex-direction: column; gap: 4px; }
.ctl button { min-width: 38px; height: 38px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--glass); color: var(--ink); font: 500 17px var(--font-body); cursor: pointer; }
.ctl button.sm { font-size: 12px; }
.empty { position: absolute; inset: 0; z-index: 5; display: none; place-items: center; color: var(--ink-soft); pointer-events: none; }

/* pop-up bubble anchored to the dot */
.vpop .leaflet-popup-content-wrapper { background: var(--surface); color: var(--ink); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.3); }
.vpop .leaflet-popup-tip { background: var(--surface); }
.vpop .leaflet-popup-content { margin: 14px 16px 16px; font: 15px/1.45 var(--font-body); }
.vpop .leaflet-popup-content p { margin: 2px 0 0; }
.leaflet-container .vpop a.leaflet-popup-close-button { top: 6px; right: 6px; width: 28px; height: 28px; padding: 0; font: 22px/26px var(--font-body); color: var(--ink-soft); }
.vpop h2 { margin: 0; padding-right: 26px; font-size: 18px; line-height: 1.25; font-weight: 700; }
.vpop .addr { margin: 2px 0 0; font: 400 12px/1.4 var(--font-mono); color: var(--ink-soft); }
.vpop .ev { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
.vpop .ev .t { margin: 0; font-weight: 500; }
.leaflet-container .vpop .ev .t a { color: var(--ink); text-decoration-color: var(--accent); text-underline-offset: 3px; }
.vpop .ev .cat { font: 500 11px var(--font-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.vpop .ev .cat.ongoing, .vpop .ev .cat.later { color: var(--ink-soft); }
.vpop .ev p { color: var(--ink-soft); font-size: 13.5px; }
.vpop .ev .when { font: 400 12.5px/1.4 var(--font-mono); color: var(--ink); }

@media (max-width: 820px) {
  .hud { right: 12px; max-width: none; }
  .ctl { left: auto; right: 12px; bottom: 34px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="map"></div>
  <div class="hud" id="hud">
    <p class="kicker">From Dads in London · <span id="issued"></span></p>
    <h1>London with the kids, <span id="weekend"></span></h1>
    <div class="filters" id="filters" role="group" aria-label="Show on map"></div>
    <p class="hint">Tap a dot for details. Dotted ring: approximate position. <a id="src" href="#" rel="noopener">Read the newsletter</a></p>
  </div>
  <div class="ctl"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="reset" class="sm" aria-label="Reset view">Fit</button><button id="full" class="sm" aria-label="Full screen">Full</button></div>
  <div class="empty" id="empty">Nothing selected to show.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
fetch('data.json', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (D) {
  var LABEL = { weekend: 'This weekend', ongoing: 'Ongoing', later: 'Later' };
  var ORDER = ['weekend', 'ongoing', 'later'];
  var active = { weekend: true, ongoing: true, later: true };
  var selected = null, popup = null;
  var $ = function (id) { return document.getElementById(id); };
  $('weekend').textContent = D.source.weekend_label;
  document.title = 'London Weekend Map, ' + D.source.weekend_label;
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function safeUrl(u) { return typeof u === 'string' && u.indexOf('https://') === 0 ? u : null; }

  var src = $('src'); var su = safeUrl(D.source.url); if (su) { src.href = su; src.target = '_blank'; } else { src.removeAttribute('href'); }
  try { $('issued').textContent = 'issue of ' + new Date(D.source.issued + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); } catch (e) {}

  var map = L.map('map', { zoomControl: false, attributionControl: false, zoomSnap: 0.25, zoomDelta: 1, wheelPxPerZoomLevel: 90 });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
  L.control.attribution({ position: 'bottomleft', prefix: false }).addTo(map);
  map.setView([51.515, -0.12], 12);

  function hudBottom() { return $('hud').getBoundingClientRect().bottom; }
  function visibleEvents(v) { return v.events.filter(function (e) { return active[e.category]; }); }
  function topCat(evs) { for (var i = 0; i < ORDER.length; i++) { if (evs.some(function (e) { return e.category === ORDER[i]; })) return ORDER[i]; } return 'ongoing'; }
  function fit() {
    var vs = D.venues.filter(function (v) { return visibleEvents(v).length; }); if (!vs.length) return;
    map.fitBounds(L.latLngBounds(vs.map(function (v) { return [v.lat, v.lng]; })), { paddingTopLeft: [24, hudBottom() + 16], paddingBottomRight: [24, 24], maxZoom: 15, animate: false });
  }

  /* filters */
  ORDER.forEach(function (c) {
    if (!D.counts[c]) return;
    var b = el('button', 'chip'); b.type = 'button'; b.setAttribute('aria-pressed', 'true');
    b.appendChild(el('span', 'key ' + c)); b.appendChild(document.createTextNode(LABEL[c])); b.appendChild(el('b', '', String(D.counts[c])));
    b.addEventListener('click', function () { active[c] = !active[c]; b.setAttribute('aria-pressed', String(active[c])); render(); });
    $('filters').appendChild(b);
  });

  /* markers */
  var markers = [];
  D.venues.forEach(function (v, i) {
    var b = el('button', 'mk'); b.type = 'button';
    var dot = el('span', 'dot'); b.appendChild(dot); b.appendChild(el('span', 'tag', v.name));
    L.DomEvent.disableClickPropagation(b);
    b.addEventListener('click', function () { select(i); });
    var mk = L.marker([v.lat, v.lng], { icon: L.divIcon({ className: 'mkicon', html: b, iconSize: [0, 0] }), keyboard: false }).addTo(map);
    markers.push({ el: b, dot: dot, mk: mk });
  });

  /* the pop-up content for one venue */
  function popupContent(i) {
    var v = D.venues[i], evs = visibleEvents(v), root = el('div', 'vbody');
    root.appendChild(el('h2', '', v.name));
    root.appendChild(el('p', 'addr', v.address + ', ' + v.postcode + (v.approx ? ' (approximate position)' : '')));
    evs.forEach(function (e) {
      var d = el('div', 'ev');
      d.appendChild(el('span', 'cat ' + e.category, LABEL[e.category]));
      var t = el('p', 't'); var u = safeUrl(e.url);
      if (u) { var a = el('a', '', e.title); a.href = u; a.target = '_blank'; a.rel = 'noopener'; t.appendChild(a); } else { t.textContent = e.title; }
      d.appendChild(t);
      if (e.when) d.appendChild(el('p', 'when', e.when));
      var meta = [e.price, e.age && ('Ages: ' + e.age)].filter(Boolean).join(' · ');
      if (meta) d.appendChild(el('p', '', meta));
      if (e.blurb) d.appendChild(el('p', '', e.blurb));
      root.appendChild(d);
    });
    return root;
  }
  function openPopup(i) {
    var v = D.venues[i], size = map.getSize();
    var p = L.popup({
      className: 'vpop', closeButton: true, autoPan: true, keepInView: true,
      minWidth: 240, maxWidth: Math.max(240, Math.min(340, size.x - 56)), maxHeight: Math.max(200, Math.min(380, size.y - hudBottom() - 90)),
      offset: [0, -12], autoPanPaddingTopLeft: [24, hudBottom() + 16], autoPanPaddingBottomRight: [24, 24]
    }).setLatLng([v.lat, v.lng]).setContent(popupContent(i));
    popup = p;           /* set before opening so closing the previous popup is ignored */
    p.openOn(map);
  }

  function render() {
    var any = 0;
    D.venues.forEach(function (v, i) {
      var evs = visibleEvents(v), m = markers[i];
      if (!evs.length) { m.el.hidden = true; return; }
      any++;
      m.el.hidden = false;
      var cat = topCat(evs);
      m.el.className = 'mk ' + cat + (v.approx ? ' approx' : '') + (selected === i ? ' sel' : '');
      m.mk.setZIndexOffset(selected === i ? 1000 : cat === 'weekend' ? 200 : 0);
      m.dot.textContent = evs.length > 1 ? String(evs.length) : '';
      m.el.setAttribute('aria-label', v.name + ', ' + evs.length + (evs.length > 1 ? ' events' : ' event'));
    });
    $('empty').style.display = any ? 'none' : 'grid';
    if (selected !== null) {
      if (visibleEvents(D.venues[selected]).length) { if (popup) popup.setContent(popupContent(selected)); }
      else { map.closePopup(); }
    }
  }

  function select(i) { selected = i; render(); openPopup(i); }
  map.on('popupclose', function (e) { if (e.popup === popup) { popup = null; selected = null; render(); } });

  $('zin').addEventListener('click', function () { map.zoomIn(); });
  $('zout').addEventListener('click', function () { map.zoomOut(); });
  $('reset').addEventListener('click', function () { map.closePopup(); fit(); });
  var fullBtn = $('full');
  if (!document.fullscreenEnabled) { fullBtn.hidden = true; }
  fullBtn.addEventListener('click', function () {
    try {
      var p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      if (p && p.catch) p.catch(function () { fullBtn.hidden = true; });
    } catch (e) { fullBtn.hidden = true; }
  });
  window.addEventListener('resize', function () { map.invalidateSize(); });

  render(); fit();
}).catch(function () { var e = document.getElementById('empty'); e.style.display = 'grid'; e.textContent = "Could not load this week's events."; });
</script>
</body>
</html>
